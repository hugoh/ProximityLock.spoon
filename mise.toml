[tools]
jactionlint = "2.6.0"
pinact = "5.0.2"
biome = "2.6.7"
ghalint = "1.6.0"
gitleaks = "8.30.1"
hk = "2.12.0"
shellcheck = "0.11.0"
shfmt = "3.14.1"
"aqua:anordal/shellharden" = "4.3.2"
lua = "5.4"
"aqua:Kampfkarren/selene" = "0.32.0"
rumdl = "0.3.4"
stylua = "2.6.0"
tombi = "1.11.2"
typos = "1.52.2"
uv = "0.13.8"
"github:owenlamont/ryl" = "0.29.0"
swiftlint = { version = "0.65.1", os = ["macos"] }

[env]
HS_MOCK_VERSION = "1.0.0"
# SwiftLint finds SourceKit under Xcode; with only the Command Line Tools (all the scanner build needs) it must be told.
TOOLCHAIN_DIR = "{% if os() == 'macos' %}/Library/Developer/CommandLineTools{% endif %}"

[tasks.docs]
run = "uvx --from git+https://github.com/hugoh/spoon-tools spoon-generate-docs"
description = "Generate docs/docs.json and docs/index.html from docstrings"

[tasks.package]
depends = ["docs"]
run = """
rm -rf dist
mkdir -p dist/ProximityLock.spoon
cp *.lua build-scanner.sh scan.swift Info.plist LICENSE README.md docs/docs.json dist/ProximityLock.spoon/
(cd dist && zip -r ../ProximityLock.spoon.zip ProximityLock.spoon)
rm -rf dist
"""
description = "Build ProximityLock.spoon.zip (Lua sources, scanner sources and docs.json)"

[tasks.deps]
description = "Install the pinned hs_mock into the project-local .rocks tree"
run = "luarocks install --tree .rocks hs-mock $HS_MOCK_VERSION"
sources = ["mise.toml"]
outputs = [".rocks/lib/luarocks/rocks-5.4/hs-mock/*/rock_manifest"]

[tasks.scan]
usage = 'arg "<needle>..." help="Part of a device name or identifier; an empty string matches every device"'
run = """
eval "set -- $usage_needle"
cache=$(mktemp -d)
trap 'rm -rf "$cache"' EXIT
sh build-scanner.sh "$PWD" "$cache" dev
"$cache/dev/ProximityLockScanner.app/Contents/MacOS/ProximityLockScanner" - "$@"
"""
description = "Build the scanner and stream matching advertisements to the terminal"

[tasks.test]
depends = ["deps"]
run = "busted --verbose"

[hooks]
postinstall = ["luarocks install busted"]
