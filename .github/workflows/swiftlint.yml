name: SwiftLint

permissions:
  contents: read

on: # yamllint disable-line rule:truthy
  push:
    branches:
      - main
    paths:
      - "**.swift"
      - ".swiftlint.yml"
      - "mise.toml"
      - ".github/workflows/swiftlint.yml"
  pull_request:
    paths:
      - "**.swift"
      - ".swiftlint.yml"
      - "mise.toml"
      - ".github/workflows/swiftlint.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# The shared hk workflow's SwiftLint step is skipped (the binary from mise needs libraries that runner
# lacks), so SwiftLint's official image lints here. Keep its version in step with mise.toml.
jobs:
  swiftlint:
    name: SwiftLint
    runs-on: ubuntu-latest
    container: ghcr.io/realm/swiftlint:0.65.1@sha256:f47e083201e47a136cda5ae847595bfe00226c444ca226fa74fa5dc648a9b057
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: swiftlint lint --strict
